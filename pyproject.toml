[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-planner"
version = "0.1.0"
description = "Desktop DJ scheduling with availability constraints and history-aware time-slot rotation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7,<7",
    "ortools>=9.10,<10",
    "openpyxl>=3.1,<4",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
packaging = ["pyinstaller>=6,<7"]

[project.scripts]
dj-planner = "dj_planner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dj_planner = ["qml/*.qml", "qml/qmldir", "qml/components/*.qml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
